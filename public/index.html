<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedCheck — Counselor Trainer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">

        <!-- Main Chat -->
        <main class="chat-area">
            <header class="chat-header">
                <div class="student-profile">
                    <div class="avatar">
                        <span class="avatar-text">AM</span>
                        <span class="status-dot"></span>
                    </div>
                    <div class="student-info">
                        <h2>Alex Miller</h2>
                        <span class="student-subtitle">3rd-Year Medical Student · Online</span>
                    </div>
                </div>

                <div class="header-actions">
                    <button class="icon-btn" id="resetBtn" aria-label="New conversation" title="New Conversation">
                        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 11-.57-8.38"/></svg>
                    </button>
                    <button class="icon-btn" id="themeToggleBtn" aria-label="Toggle theme" title="Switch theme">
                        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                        <svg class="icon-sun"  viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                    </button>
                </div>
            </header>

            <!-- Empty State -->
            <div class="empty-state" id="emptyState">
                <div class="empty-icon">💬</div>
                <h3>Start the conversation</h3>
                <p>You are the counselor. Say hello to Alex and see where the conversation goes.</p>
            </div>

            <div class="chat-messages" id="chatMessages"></div>

            <div class="chat-input-area">
                <div class="input-role-label">You (Counselor)</div>
                <form id="chatForm" class="chat-form">
                    <textarea id="chatInput" placeholder="Type your message…" rows="1" required></textarea>
                    <button type="submit" class="send-btn" id="sendBtn" aria-label="Send">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
                        </svg>
                    </button>
                </form>
            </div>
        </main>

    </div>
    <script src="app.js"></script>
</body>
</html>
